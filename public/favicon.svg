<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Narrative Engine">
  <!--
    中性图标（D26）。原来这里是一张世界 IP 插画（public/favicon.png），
    它属于内容不属于引擎，随内容一并撤出公开仓。

    形：一本摊开的书 + 一颗指路星，纯几何、无任何专有意象。
    用 SVG 而不是 PNG：一份文件覆盖所有尺寸，且能跟着系统深浅色走。
  -->
  <style>
    .ink { fill: #1c1a17; }
    .page { fill: #f4efe4; }
    .accent { fill: #b8935a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f4efe4; }
      .page { fill: #1c1a17; }
    }
  </style>
  <rect width="64" height="64" rx="12" class="ink" />
  <!-- 左右两页 -->
  <path class="page" d="M9 20c7-3 14-3 21 1v25c-7-4-14-4-21-1z" />
  <path class="page" d="M55 20c-7-3-14-3-21 1v25c7-4 14-4 21-1z" />
  <!-- 书脊 -->
  <rect class="accent" x="30.5" y="20" width="3" height="26" rx="1.5" />
  <!-- 指路星 -->
  <path
    class="accent"
    d="M32 4l2.2 5.4L40 11.2l-4.4 3.6 1.2 5.6L32 17.4 27.2 20.4l1.2-5.6L24 11.2l5.8-1.8z"
  />
</svg>
