<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Obsidian Astrolabe - Three.js Study</title>
    <style>
      :root {
        color-scheme: dark;
        background: #010107;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #010107;
      }

      .magic-circle-stage {
        position: relative;
        isolation: isolate;
        background: #010107;
        cursor: grab;
        touch-action: none;
      }

      .magic-circle-stage.is-dragging {
        cursor: grabbing;
      }

      #magic-circle-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .glow-console {
        position: absolute;
        right: clamp(12px, 2vw, 28px);
        bottom: clamp(12px, 2vw, 28px);
        z-index: 3;
        display: grid;
        width: 236px;
        gap: 12px;
        padding: 12px 14px 14px;
        color: #e8e5ee;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: rgba(4, 3, 11, 0.9);
        border-radius: 14px;
        box-shadow:
          0 14px 42px rgba(0, 0, 0, 0.52),
          inset 0 0 0 1px rgba(181, 129, 101, 0.24),
          inset 0 1px 0 rgba(221, 210, 255, 0.08);
        user-select: none;
      }

      .glow-console__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 36px;
      }

      .glow-console__title {
        margin: 0;
        color: #ddd8e7;
        font-size: 0.82rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .glow-console__reset {
        min-width: 56px;
        min-height: 36px;
        padding: 0 10px;
        color: #aaa3b7;
        font: inherit;
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        background: rgba(169, 187, 255, 0.045);
        border: 1px solid rgba(169, 187, 255, 0.16);
        border-radius: 8px;
        cursor: pointer;
        transition:
          color 150ms ease,
          background-color 150ms ease,
          border-color 150ms ease;
      }

      .glow-console__reset:hover {
        color: #e3e8f7;
        background-color: rgba(169, 187, 255, 0.1);
        border-color: rgba(169, 187, 255, 0.32);
      }

      .glow-console__reset:focus-visible {
        outline: 2px solid #cbd9ff;
        outline-offset: 2px;
      }

      .glow-console__dials {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 18px;
      }

      .glow-dial {
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .glow-dial__label {
        color: #beb8c8;
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .glow-dial__control {
        position: relative;
        width: 76px;
        height: 76px;
        touch-action: none;
      }

      .glow-dial__input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      .glow-dial__face {
        --dial-progress: 135deg;
        --dial-angle: 0deg;
        --dial-color: #ff9a55;
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 225deg,
          var(--dial-color) 0deg var(--dial-progress),
          rgba(115, 112, 137, 0.24) var(--dial-progress) 270deg,
          transparent 270deg 360deg
        );
        box-shadow: 0 7px 16px rgba(0, 0, 0, 0.5);
        cursor: ns-resize;
      }

      .glow-dial[data-tone='silver'] .glow-dial__face {
        --dial-color: #a9bbff;
      }

      .glow-dial[data-tone='violet'] .glow-dial__face {
        --dial-color: #9f73ff;
      }

      .glow-dial__face::before {
        position: absolute;
        inset: 7px;
        content: '';
        background: radial-gradient(circle at 42% 34%, #1d1a29 0%, #090811 58%, #030307 100%);
        border-radius: inherit;
        box-shadow:
          inset 0 0 0 1px rgba(223, 217, 235, 0.12),
          inset 0 -7px 14px rgba(0, 0, 0, 0.56);
      }

      .glow-dial__face::after {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 2;
        width: 7px;
        height: 7px;
        content: '';
        background: #d9d5e0;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.62);
        transform: translate(-50%, -50%);
      }

      .glow-dial__needle {
        position: absolute;
        inset: 9px;
        z-index: 1;
        pointer-events: none;
        transform: rotate(var(--dial-angle));
        transition: transform 110ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glow-dial__needle::before {
        position: absolute;
        top: 0;
        left: 50%;
        width: 2px;
        height: 15px;
        content: '';
        background: linear-gradient(to bottom, #ffffff, var(--dial-color));
        border-radius: 2px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        transform: translateX(-50%);
      }

      .glow-dial__input:focus-visible + .glow-dial__face {
        outline: 2px solid #d3ddff;
        outline-offset: 4px;
      }

      .glow-dial__value {
        color: #e6e1ec;
        font-size: 0.62rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      @media (max-width: 560px), (max-height: 620px) {
        .glow-console {
          width: 214px;
          gap: 9px;
          padding: 9px 11px 11px;
        }

        .glow-console__dials {
          gap: 12px;
        }

        .glow-dial__control {
          width: 68px;
          height: 68px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow-dial__needle,
        .glow-console__reset {
          transition: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: A single ancient astrolabe fills the viewport; it refuses the chunky game-dial look.
      OWN-WORLD: Smoke bronze and moon-silver engravings float above restrained violet space, lit from within.
      STORY: Four broad fate registers turn independently around an unreadable central aperture while ordered energy motes surge along their paths.
      FIRST VIEWPORT: One shallow oblique disc occupies roughly ninety percent of a landscape frame with a compact glow tuning console.
      FORM: Faithful reproduction of the supplied approved reference; seed key reference-b1121ab9.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <main
      class="magic-circle-stage"
      aria-label="An ancient engraved obsidian astrolabe turning in a dark violet void"
    >
      <canvas id="magic-circle-canvas" aria-hidden="true"></canvas>
      <aside class="glow-console" aria-label="Magic circle glow controls">
        <div class="glow-console__header">
          <h2 class="glow-console__title">Glow tuning</h2>
          <button class="glow-console__reset" id="glow-reset" type="button">Reset</button>
        </div>
        <div class="glow-console__dials">
          <label class="glow-dial" data-tone="bronze">
            <span class="glow-dial__label">Runes</span>
            <span class="glow-dial__control" data-dial-control>
              <input
                class="glow-dial__input"
                id="letter-glow"
                data-glow-channel="letters"
                aria-label="Rune and pattern glow"
                type="range"
                min="0"
                max="200"
                step="1"
                value="130"
              />
              <span class="glow-dial__face" aria-hidden="true">
                <span class="glow-dial__needle"></span>
              </span>
            </span>
            <output class="glow-dial__value" for="letter-glow">130%</output>
          </label>
          <label class="glow-dial" data-tone="silver">
            <span class="glow-dial__label">Rims</span>
            <span class="glow-dial__control" data-dial-control>
              <input
                class="glow-dial__input"
                id="rim-glow"
                data-glow-channel="rims"
                aria-label="Rim glow"
                type="range"
                min="0"
                max="200"
                step="1"
                value="40"
              />
              <span class="glow-dial__face" aria-hidden="true">
                <span class="glow-dial__needle"></span>
              </span>
            </span>
            <output class="glow-dial__value" for="rim-glow">40%</output>
          </label>
          <label class="glow-dial" data-tone="violet">
            <span class="glow-dial__label">Bloom</span>
            <span class="glow-dial__control" data-dial-control>
              <input
                class="glow-dial__input"
                id="bloom-glow"
                data-glow-channel="bloom"
                aria-label="Bloom scatter strength"
                type="range"
                min="0"
                max="200"
                step="1"
                value="100"
              />
              <span class="glow-dial__face" aria-hidden="true">
                <span class="glow-dial__needle"></span>
              </span>
            </span>
            <output class="glow-dial__value" for="bloom-glow">100%</output>
          </label>
          <label class="glow-dial" data-tone="violet">
            <span class="glow-dial__label">Particles</span>
            <span class="glow-dial__control" data-dial-control>
              <input
                class="glow-dial__input"
                id="particle-glow"
                data-glow-channel="particles"
                aria-label="Particle and streak brightness"
                type="range"
                min="0"
                max="200"
                step="1"
                value="55"
              />
              <span class="glow-dial__face" aria-hidden="true">
                <span class="glow-dial__needle"></span>
              </span>
            </span>
            <output class="glow-dial__value" for="particle-glow">55%</output>
          </label>
          <label class="glow-dial" data-tone="violet">
            <span class="glow-dial__label">Sky</span>
            <span class="glow-dial__control" data-dial-control>
              <input
                class="glow-dial__input"
                id="sky-glow"
                data-glow-channel="sky"
                aria-label="Nebula, aurora and starfield brightness"
                type="range"
                min="0"
                max="200"
                step="1"
                value="75"
              />
              <span class="glow-dial__face" aria-hidden="true">
                <span class="glow-dial__needle"></span>
              </span>
            </span>
            <output class="glow-dial__value" for="sky-glow">75%</output>
          </label>
        </div>
      </aside>
    </main>

    <script type="module">
      import * as THREE from 'three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
      import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

      const TAU = Math.PI * 2;
      const canvas = document.querySelector('#magic-circle-canvas');
      const stage = document.querySelector('.magic-circle-stage');
      // Owner-set presentation defaults (2026-08-08); the dial markup carries the same
      // values, and setupGlowControls() re-syncs this object from the inputs at startup.
      const glowSettings = { letters: 1.3, rims: 0.4, bloom: 1, particles: 0.55, sky: 0.75 };
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const random = mulberry32(0xb1121ab9);

      RectAreaLightUniformsLib.init();

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
        stencil: false,
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.72;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x010107, 1);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x010107, 0.012);

      const pmrem = new THREE.PMREMGenerator(renderer);
      const environmentScene = new RoomEnvironment();
      const environment = pmrem.fromScene(environmentScene, 0.025);
      scene.environment = environment.texture;
      environmentScene.dispose();
      pmrem.dispose();

      // Outermost thing in the scene: the nebula dome. resize() sizes the far plane from this,
      // so the dome and the far plane cannot drift apart. Starfield sits inside it, at 17..42.
      const BACKDROP_RADIUS = 48;

      // animate() runs scene time at this fraction of the wall clock. The rim flow speeds below
      // are authored in real seconds and converted through it, so the two cannot drift apart.
      const SCENE_TIME_SCALE = 0.66;

      // Rim flow. One head travels the outer crown in RIM_FLOW_OUTER_SECONDS; every other rim
      // gets the same LINEAR speed, so the period scales with radius and the five rims read as
      // one substance moving through the whole structure rather than five separate turntables.
      const RIM_FLOW_OUTER_SECONDS = 8;
      const RIM_FLOW_REFERENCE_RADIUS = 5.08;
      const RIM_FLOW_HEADS = 3;

      // The traveling light now carries most of the rim's brightness, so the constant layers
      // step back to make room for it. This is load-bearing, not taste: a highlight cannot be
      // added to something already at full brightness. Measured on the composite, the chase at
      // 4x gain over an untouched base was indistinguishable from no chase at all. The same
      // headroom also gives the authored surge its range back — it used to lift the frame by
      // 5%, which is imperceptible, and lifts it by 44% against this base.
      const RIM_CORE_REBALANCE = 0.62;
      const RIM_HALO_REBALANCE = 0.68;
      const RIM_VEIN_GAIN = 3;

      // far is a placeholder; resize() derives the real one from the framing distance.
      const camera = new THREE.PerspectiveCamera(10.5, 1, 0.08, 100);
      const cameraTarget = new THREE.Vector3(0, 0.03, 0);
      const outerGlowProjectionSample = new THREE.Vector3(0, -0.075, 4.33);
      const outerGlowProjectionSampleInward = new THREE.Vector3(0, -0.075, 4.32);
      const referenceOuterGlowPixelsPerWorld = 108.1;

      // Experimental orbit: dragging the stage moves the camera along a vertical arc at a
      // FIXED distance from the target — elevation only, azimuth stays authored. The distance
      // continues to come from resize()'s framing solve, so dragging never zooms.
      const CAMERA_ELEVATION_DEFAULT = 36.5;
      const CAMERA_ELEVATION_MIN = 14;
      const CAMERA_ELEVATION_MAX = 74;
      let cameraElevationDeg = CAMERA_ELEVATION_DEFAULT;
      let cameraFramingDistance = 34.2;
      let viewportHeightPx = 1;
      const cameraDirection = new THREE.Vector3(
        0,
        Math.sin(THREE.MathUtils.degToRad(cameraElevationDeg)),
        Math.cos(THREE.MathUtils.degToRad(cameraElevationDeg)),
      );

      // Physically-based mip-chain bloom, replacing UnrealBloomPass. The old pass is why the
      // glow read as period CGI: a hard luminance threshold (0.52) made highlights pop in and
      // out of the halo with an abrupt inner edge, its five fixed gaussian levels left visible
      // banding rings, and the additive composite pushed every bright core toward flat white.
      // This pass has NO threshold — everything scatters a little, as in a real lens — using
      // the 13-tap downsample / 3x3 tent upsample pyramid that has been the production
      // standard since COD:AW (Jimenez 2014). The first downsample applies a Karis average so
      // single-pixel sparks (this scene is full of them) blur into soft motes instead of
      // strobing fireflies. The composite is energy-conserving: mix(scene, bloom, strength),
      // never scene + bloom, so raising the strength trades sharpness for halation instead of
      // blowing the frame out. `strength`/`radius` keep their names because animate() drives
      // them every frame, but their scales are new — strength is now the scatter fraction
      // (~0.1..0.3 useful) and radius the per-level pyramid feedback (~0.5..0.95 useful).
      class MipBloomPass extends Pass {
        constructor() {
          super();
          this.strength = 0.18;
          this.radius = 0.85;
          this.mips = [];
          this.quad = new FullScreenQuad(null);

          const vertexShader = /* glsl */ `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `;

          this.downMaterial = new THREE.ShaderMaterial({
            uniforms: {
              tInput: { value: null },
              uTexel: { value: new THREE.Vector2(1, 1) },
              uKaris: { value: 0 },
            },
            vertexShader,
            fragmentShader: /* glsl */ `
              uniform sampler2D tInput;
              uniform vec2 uTexel;
              uniform float uKaris;
              varying vec2 vUv;

              float karisWeight(vec3 colorSample) {
                return 1.0 / (1.0 + max(colorSample.r, max(colorSample.g, colorSample.b)));
              }

              void main() {
                vec2 texel = uTexel;
                vec3 a = texture2D(tInput, vUv + texel * vec2(-2.0, 2.0)).rgb;
                vec3 b = texture2D(tInput, vUv + texel * vec2(0.0, 2.0)).rgb;
                vec3 c = texture2D(tInput, vUv + texel * vec2(2.0, 2.0)).rgb;
                vec3 d = texture2D(tInput, vUv + texel * vec2(-2.0, 0.0)).rgb;
                vec3 e = texture2D(tInput, vUv).rgb;
                vec3 f = texture2D(tInput, vUv + texel * vec2(2.0, 0.0)).rgb;
                vec3 g = texture2D(tInput, vUv + texel * vec2(-2.0, -2.0)).rgb;
                vec3 h = texture2D(tInput, vUv + texel * vec2(0.0, -2.0)).rgb;
                vec3 i = texture2D(tInput, vUv + texel * vec2(2.0, -2.0)).rgb;
                vec3 j = texture2D(tInput, vUv + texel * vec2(-1.0, 1.0)).rgb;
                vec3 k = texture2D(tInput, vUv + texel * vec2(1.0, 1.0)).rgb;
                vec3 l = texture2D(tInput, vUv + texel * vec2(-1.0, -1.0)).rgb;
                vec3 m = texture2D(tInput, vUv + texel * vec2(1.0, -1.0)).rgb;

                if (uKaris > 0.5) {
                  // First downsample only: weight the five overlapping boxes by 1/(1+maxRGB)
                  // so an isolated HDR spark cannot dominate its neighbourhood. Without this
                  // the particle field shimmers as sparks cross pixel centres frame to frame.
                  vec3 box0 = (a + b + d + e) * 0.25;
                  vec3 box1 = (b + c + e + f) * 0.25;
                  vec3 box2 = (d + e + g + h) * 0.25;
                  vec3 box3 = (e + f + h + i) * 0.25;
                  vec3 box4 = (j + k + l + m) * 0.25;
                  float w0 = karisWeight(box0);
                  float w1 = karisWeight(box1);
                  float w2 = karisWeight(box2);
                  float w3 = karisWeight(box3);
                  float w4 = karisWeight(box4);
                  vec3 result = box4 * (0.5 * w4) + (box0 * w0 + box1 * w1 + box2 * w2 + box3 * w3) * 0.125;
                  float norm = 0.5 * w4 + (w0 + w1 + w2 + w3) * 0.125;
                  gl_FragColor = vec4(result / max(norm, 1e-4), 1.0);
                } else {
                  vec3 result = e * 0.125;
                  result += (a + c + g + i) * 0.03125;
                  result += (b + d + f + h) * 0.0625;
                  result += (j + k + l + m) * 0.125;
                  gl_FragColor = vec4(result, 1.0);
                }
              }
            `,
            depthTest: false,
            depthWrite: false,
          });

          // Rendered additively INTO the larger mip, which still holds its own downsample:
          // mip[i] += tent(mip[i+1]) * radius. The pyramid therefore accumulates
          // sum(radius^level * blur_level), and compositeMaterial divides by the matching
          // scalar so changing the radius reshapes the halo without changing its energy.
          this.upMaterial = new THREE.ShaderMaterial({
            uniforms: {
              tInput: { value: null },
              uTexel: { value: new THREE.Vector2(1, 1) },
              uScale: { value: 1 },
            },
            vertexShader,
            fragmentShader: /* glsl */ `
              uniform sampler2D tInput;
              uniform vec2 uTexel;
              uniform float uScale;
              varying vec2 vUv;

              void main() {
                vec2 texel = uTexel;
                vec3 result = texture2D(tInput, vUv + texel * vec2(-1.0, 1.0)).rgb;
                result += texture2D(tInput, vUv + texel * vec2(0.0, 1.0)).rgb * 2.0;
                result += texture2D(tInput, vUv + texel * vec2(1.0, 1.0)).rgb;
                result += texture2D(tInput, vUv + texel * vec2(-1.0, 0.0)).rgb * 2.0;
                result += texture2D(tInput, vUv).rgb * 4.0;
                result += texture2D(tInput, vUv + texel * vec2(1.0, 0.0)).rgb * 2.0;
                result += texture2D(tInput, vUv + texel * vec2(-1.0, -1.0)).rgb;
                result += texture2D(tInput, vUv + texel * vec2(0.0, -1.0)).rgb * 2.0;
                result += texture2D(tInput, vUv + texel * vec2(1.0, -1.0)).rgb;
                gl_FragColor = vec4(result * (uScale / 16.0), 1.0);
              }
            `,
            depthTest: false,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            transparent: true,
          });

          this.compositeMaterial = new THREE.ShaderMaterial({
            uniforms: {
              tDiffuse: { value: null },
              tBloom: { value: null },
              uStrength: { value: this.strength },
              uNorm: { value: 1 },
            },
            vertexShader,
            fragmentShader: /* glsl */ `
              uniform sampler2D tDiffuse;
              uniform sampler2D tBloom;
              uniform float uStrength;
              uniform float uNorm;
              varying vec2 vUv;

              void main() {
                vec3 sceneColor = texture2D(tDiffuse, vUv).rgb;
                vec3 bloomColor = texture2D(tBloom, vUv).rgb / uNorm;
                gl_FragColor = vec4(mix(sceneColor, bloomColor, uStrength), 1.0);
              }
            `,
            depthTest: false,
            depthWrite: false,
          });
        }

        setSize(width, height) {
          for (const mip of this.mips) mip.target.dispose();
          this.mips = [];
          let mipWidth = Math.max(1, Math.floor(width / 2));
          let mipHeight = Math.max(1, Math.floor(height / 2));
          // Deep mips are what carry the wide halation; stop only once the buffer is too
          // small to blur meaningfully. At 1600x1000 this yields six levels (800 → 25).
          while (Math.min(mipWidth, mipHeight) >= 16 && this.mips.length < 8) {
            this.mips.push({
              target: new THREE.WebGLRenderTarget(mipWidth, mipHeight, {
                type: THREE.HalfFloatType,
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                depthBuffer: false,
              }),
              texelSize: new THREE.Vector2(1 / mipWidth, 1 / mipHeight),
            });
            mipWidth = Math.max(1, Math.floor(mipWidth / 2));
            mipHeight = Math.max(1, Math.floor(mipHeight / 2));
          }
        }

        render(renderer, writeBuffer, readBuffer) {
          if (this.mips.length === 0) return;
          const previousAutoClear = renderer.autoClear;
          renderer.autoClear = false;

          let sourceTexture = readBuffer.texture;
          let sourceTexel = new THREE.Vector2(1 / readBuffer.width, 1 / readBuffer.height);
          this.quad.material = this.downMaterial;
          for (let level = 0; level < this.mips.length; level += 1) {
            const mip = this.mips[level];
            this.downMaterial.uniforms.tInput.value = sourceTexture;
            this.downMaterial.uniforms.uTexel.value.copy(sourceTexel);
            this.downMaterial.uniforms.uKaris.value = level === 0 ? 1 : 0;
            renderer.setRenderTarget(mip.target);
            renderer.clear();
            this.quad.render(renderer);
            sourceTexture = mip.target.texture;
            sourceTexel = mip.texelSize;
          }

          this.quad.material = this.upMaterial;
          this.upMaterial.uniforms.uScale.value = this.radius;
          for (let level = this.mips.length - 2; level >= 0; level -= 1) {
            const smaller = this.mips[level + 1];
            this.upMaterial.uniforms.tInput.value = smaller.target.texture;
            this.upMaterial.uniforms.uTexel.value.copy(smaller.texelSize);
            renderer.setRenderTarget(this.mips[level].target);
            this.quad.render(renderer);
          }

          let norm = 0;
          for (let level = 0; level < this.mips.length; level += 1) {
            norm += Math.pow(this.radius, level);
          }
          this.quad.material = this.compositeMaterial;
          this.compositeMaterial.uniforms.tDiffuse.value = readBuffer.texture;
          this.compositeMaterial.uniforms.tBloom.value = this.mips[0].target.texture;
          this.compositeMaterial.uniforms.uStrength.value = this.strength;
          this.compositeMaterial.uniforms.uNorm.value = norm;
          renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
          if (!this.renderToScreen) renderer.clear();
          this.quad.render(renderer);

          renderer.autoClear = previousAutoClear;
        }
      }

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const bloom = new MipBloomPass();
      composer.addPass(bloom);

      const gradePass = new ShaderPass({
        uniforms: {
          tDiffuse: { value: null },
          uTime: { value: 0 },
          uResolution: { value: new THREE.Vector2(1, 1) },
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;

          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform sampler2D tDiffuse;
          uniform float uTime;
          uniform vec2 uResolution;
          varying vec2 vUv;

          float hash21(vec2 point) {
            point = fract(point * vec2(123.34, 345.45));
            point += dot(point, point + 34.345);
            return fract(point.x * point.y);
          }

          void main() {
            vec2 centered = vUv - 0.5;
            float radial = dot(centered, centered);
            vec2 aberration = centered * 0.00018;

            vec3 color;
            color.r = texture2D(tDiffuse, vUv + aberration).r;
            color.g = texture2D(tDiffuse, vUv).g;
            color.b = texture2D(tDiffuse, vUv - aberration).b;

            float luminance = dot(color, vec3(0.2126, 0.7152, 0.0722));
            color = mix(vec3(luminance), color, 0.91);
            color = (color - 0.5) * 1.07 + 0.5;
            color *= vec3(1.015, 0.985, 1.025);

            float grain = hash21(vUv * uResolution + fract(uTime * 0.061) * 79.0) - 0.5;
            color += grain * 0.007;
            // Eased from 0.48 at 0.12: with the single-hue dome the corners fell to pure
            // black and the frame read as a disc floating in nothing. The richer dome plus
            // this lighter vignette keeps the corners alive without losing the focal pull.
            color *= 1.0 - smoothstep(0.16, 0.78, radial) * 0.4;

            gl_FragColor = vec4(max(color, vec3(0.0)), 1.0);
          }
        `,
      });
      composer.addPass(gradePass);
      composer.addPass(new OutputPass());

      const palette = {
        bronze: new THREE.Color(0x76503e),
        bronzeLight: new THREE.Color(0xb58165),
        bronzeEnergy: new THREE.Color(0xff9a55),
        silver: new THREE.Color(0x667086),

      };

      const microTexture = createMicroTexture();
      const materials = createMaterials();
      const motionTracks = [];
      const energyTracks = [];
      const runeIgnitionTracks = [];
      const energyUniformTracks = [];
      const energySurgeTracks = [];
      const rimEnergyStrengthTracks = [];
      const screenSpaceTextureGlows = [];
      const screenSpaceRimHalos = [];
      let screenGlowScale = 1;

      const registerConfigs = [

      registerConfigs.forEach((config, index) => {
        const register = createRegister(config, index);

      const patina = createPatinaField();

      motionTracks.push({

      const sigilField = createSigilField();
      astrolabe.add(sigilField);
      motionTracks.push({

      const filigree = createCentralFiligree();
      astrolabe.add(filigree);
      motionTracks.push({

      const aperture = createAperture();

      const energyLights = addLighting();

      const clock = new THREE.Clock();
      const reducedMotionTime = 23.75;

      function createMaterials() {
        const obsidian = new THREE.MeshPhysicalMaterial({
          color: 0x05050b,

        return { obsidian, bronze, silver, voidMaterial };
      }

      function createFoundation(parent) {
        // The crown rides no register, so it opens the alternation the registers continue:
        // crown +1, then -1, +1, -1 inward, and the aperture rim closes it on +1.
        const outerCrown = createLuminousTorus(5.08, 0.03, materials.bronze, 'bronze', 256, 9, 1);

      function createRegister(config, index) {
        const group = new THREE.Group();

        const railMaterial = config.color === 'bronze' ? materials.bronze : materials.silver;
        if (index > 0) {

          // the ring it belongs to rather than as a separate effect laid over it.

            config.outer - 0.012,
            tube,
            railMaterial,

            config.direction,
          );
          outerRail.position.y = 0.012;

        const registerEnergyScale = 0.78 + index * 0.08;

        });

        );

        engraving.position.y = 0.018;
        engraving.renderOrder = 2;
        group.add(engraving);

        const runeGlowMaterial = new THREE.MeshBasicMaterial({
          map: texture.userData.glowTexture,

        });

          new THREE.RingGeometry(config.inner + 0.018, config.outer - 0.018, 256, 1),
          runeGlowMaterial,
        );
        runeGlow.rotation.x = -Math.PI / 2;
        runeGlow.position.y = 0.014;
        runeGlow.scale.setScalar(1.0015);
        runeGlow.renderOrder = 1;

        energyTracks.push({
          material: runeGlowMaterial,
          property: 'opacity',
          channel: 'letters',

          amplitude: 0.025,

        });

          texture.userData.glyphTexture,
          texture.userData.glyphCount,
          config,
          index,
        );
        const runeIgnition = new THREE.Mesh(engraving.geometry, runeIgnitionMaterial);
        runeIgnition.rotation.x = -Math.PI / 2;
        runeIgnition.position.y = 0.021;
        runeIgnition.scale.setScalar(1.0008);
        runeIgnition.renderOrder = 3;
        group.add(runeIgnition);
        runeIgnitionTracks.push({
          time: runeIgnitionMaterial.uniforms.uTime,
          strength: runeIgnitionMaterial.uniforms.uStrength,
          surge: runeIgnitionMaterial.uniforms.uSurge,

        return group;
      }

      function createRegisterTexture(config, layerIndex) {
        const size = 1024;
        const center = size / 2;
        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = size;
        textureCanvas.height = size;
        const context = textureCanvas.getContext('2d');
        const glyphCanvas = document.createElement('canvas');
        glyphCanvas.width = size;
        glyphCanvas.height = size;
        const glyphContext = glyphCanvas.getContext('2d');
        const layerRandom = mulberry32(0x9173a1 + layerIndex * 701);
        const color = config.color === 'bronze' ? '#ad7657' : '#9eacc8';
        const highlight = config.color === 'bronze' ? '#d2a080' : '#d3dced';
        const outerPixel = center - 5;
        const innerPixel = (config.inner / config.outer) * outerPixel;
        const midPixel = (innerPixel + outerPixel) * 0.5;
        const bandPixels = outerPixel - innerPixel;
        const glyphScale = Math.max(10, Math.min(22, bandPixels * 0.42));

        context.clearRect(0, 0, size, size);
        context.translate(center, center);
        context.lineCap = 'round';
        context.lineJoin = 'round';
        context.strokeStyle = color;
        context.shadowColor = color;
        context.shadowBlur = config.color === 'silver' ? 1.4 : 0.8;
        glyphContext.clearRect(0, 0, size, size);
        glyphContext.translate(center, center);

        context.globalAlpha = 0.78;
        const runeAlphabet = Array.from('ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛋᛏᛒᛖᛗᛚᛜᛞᛟ');
        const glyphCount = Math.round(config.count * 1.65);
        for (let glyphIndex = 0; glyphIndex < glyphCount; glyphIndex += 1) {
          const angle = (glyphIndex / glyphCount) * TAU;
          const major = glyphIndex % 11 === 0;
          const wobble = (layerRandom() - 0.5) * bandPixels * 0.08;
          const glyph = runeAlphabet[(glyphIndex + layerIndex * 5) % runeAlphabet.length];
          const font = `${major ? 600 : 500} ${glyphScale * (major ? 1.82 : 1.58)}px "Segoe UI Historic", "Segoe UI Symbol", serif`;
          context.save();
          context.rotate(angle);
          context.translate(0, -midPixel - wobble);
          context.globalAlpha = (major ? 0.9 : 0.5) + layerRandom() * (major ? 0.1 : 0.42);
          context.fillStyle = major ? highlight : color;
          context.font = font;
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.shadowBlur = major ? 2.2 : 0.8;
          context.fillText(glyph, 0, 0);
          context.restore();

          // The ignition mask carries SHAPE ONLY; the shader reads its alpha and nothing else.
          // This used to encode the glyph index into the red channel, but a discrete index
          // cannot survive the linear/mipmap/anisotropic filtering this mask needs -- see the
          // note in createRuneIgnitionMaterial. The index is now derived from the angle, which
          // is exact because every glyph sits at exactly (glyphIndex / glyphCount) * TAU.
          glyphContext.save();
          glyphContext.rotate(angle);
          glyphContext.translate(0, -midPixel - wobble);
          glyphContext.globalAlpha = 1;
          glyphContext.fillStyle = '#ffffff';
          glyphContext.font = font;
          glyphContext.textAlign = 'center';
          glyphContext.textBaseline = 'middle';
          glyphContext.fillText(glyph, 0, 0);
          glyphContext.restore();
        }

        const tickCount = config.ticks ? glyphCount * 2 : glyphCount;
        context.globalAlpha = config.ticks ? 0.58 : 0.2;
        context.strokeStyle = color;
        context.shadowBlur = 0;
        context.lineWidth = config.ticks ? 1.6 : 0.85;
        for (let tickIndex = 0; tickIndex < tickCount; tickIndex += 1) {
          const angle = (tickIndex / tickCount) * TAU;
          const length = tickIndex % 6 === 0 ? bandPixels * 0.32 : bandPixels * 0.17;
          const start = innerPixel + bandPixels * 0.06;
          context.beginPath();
          context.moveTo(Math.cos(angle) * start, Math.sin(angle) * start);
          context.lineTo(Math.cos(angle) * (start + length), Math.sin(angle) * (start + length));
          context.stroke();
        }

        context.globalAlpha = 0.13;
        context.strokeStyle = highlight;
        context.lineWidth = 0.65;
        for (let scratchIndex = 0; scratchIndex < 20; scratchIndex += 1) {
          const angle = layerRandom() * TAU;
          const length = 0.015 + layerRandom() * 0.05;
          context.beginPath();
          context.arc(
            0,
            0,
            midPixel + (layerRandom() - 0.5) * bandPixels * 0.7,
            angle,
            angle + length,
          );
          context.stroke();
        }

        const texture = new THREE.CanvasTexture(textureCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.needsUpdate = true;

        const glyphTexture = new THREE.CanvasTexture(glyphCanvas);
        glyphTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        glyphTexture.minFilter = THREE.LinearMipmapLinearFilter;
        glyphTexture.magFilter = THREE.LinearFilter;
        glyphTexture.needsUpdate = true;

        texture.userData.glowTexture = createScreenSpaceGlowTexture(
          texture,
          config.color === 'bronze' ? 9 : 8,
        );
        texture.userData.glyphTexture = glyphTexture;
        texture.userData.glyphCount = glyphCount;
        return texture;
      }

      function createRuneIgnitionMaterial(glyphTexture, glyphCount, config, layerIndex) {
        const textureSize = glyphTexture.image.width;
        const bandOuter = (textureSize * 0.5 - 5) / textureSize;
        const energyColor =
          config.color === 'bronze'
            ? palette.bronzeEnergy.clone().lerp(palette.bronzeLight, 0.28)
            : palette.silverEnergy.clone().lerp(palette.silverLight, 0.24);
        const hotColor =
          config.color === 'bronze'
            ? palette.bronzeLight.clone().lerp(palette.coldWhite, 0.68)
            : palette.silverLight.clone().lerp(palette.coldWhite, 0.82);

        return new THREE.ShaderMaterial({
          uniforms: {
            uGlyphMap: { value: glyphTexture },
            uTime: { value: 0 },
            uStrength: { value: 0 },
            uSeed: { value: 17.31 + layerIndex * 29.17 },
            uSurge: { value: 0 },
            uGlyphCount: { value: glyphCount },
            uCycleSeconds: { value: 4.2 + layerIndex * 0.66 },
            uBandInner: { value: (config.inner / config.outer) * bandOuter },
            uBandOuter: { value: bandOuter },
            uColor: { value: energyColor },
            uHotColor: { value: hotColor },
          },
          vertexShader: /* glsl */ `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: /* glsl */ `
            uniform sampler2D uGlyphMap;
            uniform float uTime;
            uniform float uStrength;
            uniform float uSeed;
            uniform float uSurge;
            uniform float uGlyphCount;
            uniform float uCycleSeconds;
            uniform float uBandInner;
            uniform float uBandOuter;
            uniform vec3 uColor;
            uniform vec3 uHotColor;
            varying vec2 vUv;

            const float TAU = 6.283185307179586;

            float hash11(float value) {
              return fract(sin(value * 127.1 + 311.7) * 43758.5453123);
            }

            void main() {
              float glyphAlpha = texture2D(uGlyphMap, vUv).a;
              if (glyphAlpha < 0.02 || uStrength < 0.002) discard;

              // Split the sampled coverage into a solid core and the cut profile at its rim.
              // Both are pure functions of the coverage the sampler actually returned, so they
              // hold at every mip level and every degree of foreshortening.
              //
              // WARNING: this used to erode the mask with four taps at a fixed base-level texel
              // offset (uTexel) and subtract that from glyphAlpha. But glyphAlpha comes back
              // through the mipmap and anisotropic chain, so the taps and the sample were
              // measuring the mask at two different scales and their difference was mostly
              // filter noise. That noise drove the colour, the hot vein and the alpha at once,
              // which is why a charging rune read as mottled and speckled instead of evenly
              // lit. Measuring the mask at a scale the sampler is not using is the same mistake
              // the glyph index made above; do not reintroduce fixed-texel taps here.
              float interior = smoothstep(0.30, 0.95, glyphAlpha);
              float engravedEdge = (1.0 - interior) * glyphAlpha;

              vec2 centered = vUv - 0.5;
              float localClock = uTime / uCycleSeconds + fract(uSeed * 0.113) * 7.0;
              float epoch = floor(localClock);
              float life = fract(localClock);
              float eventSeed = hash11(epoch * 73.17 + uSeed * 5.13);
              float arbitraryGlyph = floor(eventSeed * uGlyphCount);
              float majorCount = floor((uGlyphCount - 1.0) / 11.0) + 1.0;
              float majorGlyph = min(
                uGlyphCount - 1.0,
                floor(hash11(epoch * 91.37 + uSeed * 2.71) * majorCount) * 11.0
              );
              float favorMajor = step(0.58, hash11(epoch * 43.19 + uSeed * 7.23));
              float targetGlyph = mix(arbitraryGlyph, majorGlyph, favorMajor);

              // Which engraving does this pixel belong to? Derived from the angle, NEVER
              // sampled. createRegisterTexture lays every glyph at exactly
              // (glyphIndex / glyphCount) * TAU, so the index is analytic: continuous across
              // the surface, constant as the register turns, and immune to texture filtering.
              //
              // WARNING: do not reintroduce a sampled index. The mask used to carry it in red,
              // which is discrete data read through a linear + mipmap + anisotropic
              // filter and then hard-thresholded: neighbouring glyph indices blended into each
              // other, minification averaged whole runs of them into noise, and the
              // unpremultiply divide (red / alpha) lost the index outright on antialiased
              // edges. An offscreen 70-frame probe measured ~90% of the lit glyph's pixels
              // toggling every frame while the ring had turned 0.2 px. That was the flicker.
              // Turning mipmapping ON (2026-08-07) treated the symptom and made the decode
              // worse; this removes the decode instead.
              float slice = mod(atan(centered.x, centered.y) / TAU * uGlyphCount, uGlyphCount);
              float sliceDistance = abs(
                mod(slice - targetGlyph + uGlyphCount * 0.5, uGlyphCount) - uGlyphCount * 0.5
              );
              // Feather the cell boundary by ~1 texel so the cut is not aliased, while staying
              // inside the half cell so a neighbouring glyph's ink can never be lit.
              float selected = 1.0 - smoothstep(0.46, 0.5, sliceDistance);

              float attack = smoothstep(0.04, 0.2, life);
              float release = 1.0 - smoothstep(0.62, 0.96, life);
              float envelope = selected * attack * release;

              // A short white-hot pop right as the charge lands. The eased envelope alone
              // read as a slow fade-in that the eye never caught starting; the pop marks the
              // moment, then the tempered-metal charge carries the tail.
              float flash =
                selected * smoothstep(0.04, 0.14, life) * (1.0 - smoothstep(0.14, 0.4, life));

              // Surge chain: while the scene's authored surge passes, an arc of charge sweeps
              // the register, igniting a couple of glyph cells at a time. Direction and phase
              // come from the layer seed so the four registers hand the wave to each other
              // instead of firing in lockstep. Outside the surge this term is exactly zero.
              float waveDirection = mix(1.0, -1.0, step(0.5, fract(uSeed * 0.531)));
