        group.position.y = 0.395;

        const wall = new THREE.Mesh(
          new THREE.CylinderGeometry(0.94, 0.99, 0.12, 160, 1, false),
          materials.obsidian,
        );
        wall.castShadow = true;
        group.add(wall);

        const voidDisc = new THREE.Mesh(
          new THREE.CircleGeometry(0.91, 192),
          materials.voidMaterial,
        );
        voidDisc.rotation.x = -Math.PI / 2;
        voidDisc.position.y = 0.064;
        group.add(voidDisc);

        const innerRim = createLuminousTorus(0.95, 0.018, materials.silver, 'silver', 224, 8, 1);
        innerRim.position.y = 0.07;
        group.add(innerRim);

        const tickTexture = createApertureTickTexture();
        const tickMaterial = new THREE.MeshBasicMaterial({
          map: createScreenSpaceGlowTexture(tickTexture, 11),
          transparent: true,
          opacity: 0.94,
          depthWrite: false,
          toneMapped: false,
          side: THREE.DoubleSide,
        });
        const tickGroup = new THREE.Group();
        tickGroup.position.y = 0.015;
        const tickRingGeometry = new THREE.RingGeometry(1.03, 1.27, 192, 1);
        const tickGlowMaterial = new THREE.MeshBasicMaterial({
          map: tickTexture,
          color: 0xcbd9ff,
          transparent: true,
          opacity: 0.7,
          depthWrite: false,
          depthTest: true,
          blending: THREE.AdditiveBlending,
          toneMapped: false,
          side: THREE.DoubleSide,
        });
        const tickGlow = new THREE.Mesh(tickRingGeometry, tickGlowMaterial);
        tickGlow.rotation.x = -Math.PI / 2;
        tickGlow.position.y = -0.007;
        tickGlow.renderOrder = 5;
        tickGroup.add(tickGlow);

        const ticks = new THREE.Mesh(tickRingGeometry, tickMaterial);
        ticks.rotation.x = -Math.PI / 2;
        ticks.renderOrder = 6;
        tickGroup.add(ticks);

        const tickPositions = [];
        for (let tickIndex = 0; tickIndex < 96; tickIndex += 1) {
          const angle = (tickIndex / 96) * TAU;
          const start = tickIndex % 8 === 0 ? 1.04 : 1.09;
          const end = tickIndex % 8 === 0 ? 1.26 : 1.22;
          tickPositions.push(
            Math.cos(angle) * start,
            0.006,
            Math.sin(angle) * start,
            Math.cos(angle) * end,
            0.006,
            Math.sin(angle) * end,
          );
        }
        const tickGeometry = new THREE.BufferGeometry();
        tickGeometry.setAttribute('position', new THREE.Float32BufferAttribute(tickPositions, 3));
        const tickLines = new THREE.LineSegments(
          tickGeometry,
          new THREE.LineBasicMaterial({
            color: 0xd8e4ff,
            transparent: true,
            opacity: 0.78,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            toneMapped: false,
          }),
        );
        tickGroup.add(tickLines);
        energyTracks.push({
          material: tickGlowMaterial,
          property: 'opacity',
          channel: 'letters',
          base: tickGlowMaterial.opacity,
          amplitude: 0.065,
          phase: 2.4,
          speed: 0.27,
        });
        group.add(tickGroup);
        motionTracks.push({
          group: tickGroup,
          period: 57,
          direction: -1,
          phase: 0.15,
          baseY: 0.015,
          floatAmplitude: 0,
        });

        const light = new THREE.PointLight(0x4a376c, 0.28, 2.8, 2);
        light.position.y = 0.8;
        group.add(light);

        return { group, light };
      }

      function createApertureTickTexture() {
        const size = 1024;
        const center = size / 2;
        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = size;
        textureCanvas.height = size;
        const context = textureCanvas.getContext('2d');
        context.translate(center, center);
        context.strokeStyle = '#bac8e2';
        context.lineCap = 'round';

        for (let index = 0; index < 96; index += 1) {
          const angle = (index / 96) * TAU;
          const start = index % 8 === 0 ? 386 : 401;
          const end = 454;
          context.globalAlpha = index % 8 === 0 ? 0.85 : 0.48;
          context.lineWidth = index % 8 === 0 ? 2.6 : 1.4;
          context.beginPath();
          context.moveTo(Math.cos(angle) * start, Math.sin(angle) * start);
          context.lineTo(Math.cos(angle) * end, Math.sin(angle) * end);
          context.stroke();
        }

        const texture = new THREE.CanvasTexture(textureCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        return texture;
      }

      function createGlints() {
        const group = new THREE.Group();
        const items = [];
        const size = 128;
        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = size;
        textureCanvas.height = size;
        const context = textureCanvas.getContext('2d');
        const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 60);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.045, 'rgba(255,255,255,0.92)');
        gradient.addColorStop(0.16, 'rgba(190,176,244,0.3)');
        gradient.addColorStop(0.48, 'rgba(115,73,181,0.06)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
        context.strokeStyle = 'rgba(245,238,255,0.7)';
        context.lineCap = 'round';
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(64, 21);
        context.lineTo(64, 107);
        context.moveTo(28, 64);
        context.lineTo(100, 64);
        context.stroke();

        const texture = new THREE.CanvasTexture(textureCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const glintData = [
          [5.05, 0.12, 'bronze', 0.38],
          [5.04, 1.02, 'silver', 0.22],
          [4.78, 2.38, 'bronze', 0.3],
          [5.08, 3.02, 'silver', 0.34],
          [4.92, 4.14, 'bronze', 0.24],
          [5.06, 5.45, 'silver', 0.3],
          [3.62, 0.73, 'silver', 0.18],
          [3.08, 2.92, 'bronze', 0.2],
          [2.18, 4.88, 'silver', 0.22],
        ];

        glintData.forEach(([radius, angle, tone, opacity], index) => {
          const material = new THREE.SpriteMaterial({
            map: texture,
            color: tone === 'bronze' ? 0xe0a885 : 0xb9c8f1,
            transparent: true,
            opacity,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            toneMapped: false,
          });
          const sprite = new THREE.Sprite(material);
          sprite.position.set(Math.cos(angle) * radius, 0.4, Math.sin(angle) * radius);
          const scale = index < 6 ? 0.19 : 0.13;
          sprite.scale.set(scale, scale, 1);
          sprite.renderOrder = 8;
          group.add(sprite);
          items.push({ material, baseOpacity: opacity, phase: index * 0.83 });
        });

        return { group, items };
      }

      function createParticleField() {
        const particleCount = 620;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const radii = new Float32Array(particleCount);
        const angles = new Float32Array(particleCount);
        const speeds = new Float32Array(particleCount);
        const heights = new Float32Array(particleCount);
        const lifts = new Float32Array(particleCount);
        const sizes = new Float32Array(particleCount);
        const opacities = new Float32Array(particleCount);
        const phases = new Float32Array(particleCount);
        const types = new Float32Array(particleCount);
        const particleRandom = mulberry32(0x66d7a319);
        const bandRadii = [1.08, 2.06, 3.0, 4.0, 5.06];
        const bandTones = ['silver', 'silver', 'bronze', 'silver', 'bronze'];
        const violetParticle = new THREE.Color(0x9f73ff);
        const whiteParticle = new THREE.Color(0xf5f2ff);

        for (let index = 0; index < particleCount; index += 1) {
          const type = index < 360 ? 0 : index < 545 ? 1 : 2;
          const bandIndex = Math.floor(particleRandom() * bandRadii.length);
          const direction = bandIndex % 2 === 0 ? 1 : -1;
          const tone = bandTones[bandIndex];
          const baseColor = (
            tone === 'bronze' ? palette.bronzeEnergy : palette.silverEnergy
          ).clone();

          types[index] = type;
          angles[index] = particleRandom() * TAU;
          phases[index] = particleRandom() * TAU;

          if (type === 0) {
            radii[index] = bandRadii[bandIndex] + (particleRandom() - 0.5) * 0.3;
            speeds[index] = direction * (0.012 + particleRandom() * 0.025);
            heights[index] = 0.14 + particleRandom() * 0.42 + bandIndex * 0.018;
            lifts[index] = 0.025 + particleRandom() * 0.09;
            sizes[index] = 0.52 + particleRandom() * 1.05;
            opacities[index] = 0.13 + particleRandom() * 0.23;
          } else if (type === 1) {
            radii[index] = bandRadii[bandIndex] + (particleRandom() - 0.5) * 0.22;
            speeds[index] = direction * (0.02 + particleRandom() * 0.034);
            heights[index] = 0.2 + particleRandom() * 0.68;
            lifts[index] = 0.07 + particleRandom() * 0.18;
            sizes[index] = 1.15 + particleRandom() * 1.9;
            opacities[index] = 0.26 + particleRandom() * 0.45;
          } else {
            radii[index] = 0.96 + particleRandom() * 0.72;
            speeds[index] = (particleRandom() > 0.5 ? 1 : -1) * (0.018 + particleRandom() * 0.024);
            heights[index] = 0.16;
            lifts[index] = 1.05 + particleRandom() * 0.85;
            sizes[index] = 0.9 + particleRandom() * 1.65;
            opacities[index] = 0.24 + particleRandom() * 0.38;
            baseColor.copy(violetParticle).lerp(palette.silverEnergy, particleRandom() * 0.7);
          }

          if (particleRandom() > 0.9) {
            baseColor.lerp(whiteParticle, 0.58);
          }
          colors.set([baseColor.r, baseColor.g, baseColor.b], index * 3);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('aRadius', new THREE.BufferAttribute(radii, 1));
        geometry.setAttribute('aAngle', new THREE.BufferAttribute(angles, 1));
        geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
        geometry.setAttribute('aHeight', new THREE.BufferAttribute(heights, 1));
        geometry.setAttribute('aLift', new THREE.BufferAttribute(lifts, 1));
        geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('aOpacity', new THREE.BufferAttribute(opacities, 1));
        geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
        geometry.setAttribute('aType', new THREE.BufferAttribute(types, 1));

        const uniforms = {
          uTime: { value: 0 },
          uPixelRatio: { value: 1 },
          uSurge: { value: 0 },
          uDial: { value: 1 },
        };
        const material = new THREE.ShaderMaterial({
          uniforms,
          transparent: true,
          depthWrite: false,
          depthTest: true,
          blending: THREE.AdditiveBlending,
          toneMapped: false,
          vertexShader: /* glsl */ `
            uniform float uTime;
            uniform float uPixelRatio;
            uniform float uSurge;
            attribute vec3 aColor;
            attribute float aRadius;
            attribute float aAngle;
            attribute float aSpeed;
            attribute float aHeight;
            attribute float aLift;
            attribute float aSize;
            attribute float aOpacity;
            attribute float aPhase;
            attribute float aType;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vHeat;

            void main() {
              float angle = aAngle + uTime * aSpeed;
              float radius = aRadius + sin(uTime * 0.14 + aPhase) * 0.045;
              float height = aHeight + sin(uTime * 0.37 + aPhase) * aLift;
              float opacity = aOpacity;
              float rise = 0.0;

              if (aType > 1.5) {
                rise = fract(aPhase / 6.28318530718 + uTime * (0.018 + abs(aSpeed) * 0.3));
                radius += sin(uTime * 0.22 + aPhase + rise * 5.0) * 0.14;
                height = aHeight + rise * aLift;
                opacity *= smoothstep(0.0, 0.14, rise) * (1.0 - smoothstep(0.7, 1.0, rise));
              } else if (aType > 0.5) {
                radius += sin(uTime * 0.26 + aPhase * 1.7) * 0.075;
              }

              float waveRadius = mod(uTime * 0.34, 5.9);
              float radialWave = exp(-pow((aRadius - waveRadius) * 1.85, 2.0));
              vec3 localPosition = vec3(cos(angle) * radius, height, sin(angle) * radius);
              vec4 viewPosition = modelViewMatrix * vec4(localPosition, 1.0);
              float perspective = 78.0 / max(-viewPosition.z, 1.0);
              float pointScale = 1.0 + radialWave * 1.35 + uSurge * 0.42;

              gl_Position = projectionMatrix * viewPosition;
              gl_PointSize = clamp(aSize * pointScale * uPixelRatio * perspective, 0.7, 15.0);
              vColor = mix(aColor, vec3(1.0), radialWave * 0.36 + uSurge * 0.12);
              vAlpha = opacity * (1.0 + radialWave * 1.15 + uSurge * 0.5);
              vHeat = max(radialWave, uSurge * 0.7) + (aType > 0.5 ? 0.16 : 0.0);
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uDial;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vHeat;

            void main() {
              vec2 point = gl_PointCoord - 0.5;
              float radius = length(point) * 2.0;
              if (radius > 1.0) discard;
              float halo = pow(max(1.0 - radius, 0.0), 2.35);
              float core = smoothstep(0.34, 0.0, radius);
              vec3 color = mix(vColor, vec3(1.0), core * (0.56 + vHeat * 0.18));
              float alpha = halo * vAlpha * uDial;
              if (alpha < 0.004) discard;
              gl_FragColor = vec4(color, alpha);
            }
          `,
        });

        const points = new THREE.Points(geometry, material);
        points.frustumCulled = false;
        points.renderOrder = 7;
        return { points, uniforms };
      }

      function createOrbitStreaks() {
        const streakCount = 72;
        const bandRadii = [1.08, 2.06, 3, 4, 5.06];
        const bandTones = ['silver', 'silver', 'bronze', 'silver', 'bronze'];
        const streakRandom = mulberry32(0xb72ea951);
        const angles = new Float32Array(streakCount);
        const radii = new Float32Array(streakCount);
        const speeds = new Float32Array(streakCount);
        const heights = new Float32Array(streakCount);
        const lengths = new Float32Array(streakCount);
        const widths = new Float32Array(streakCount);
        const phases = new Float32Array(streakCount);
        const opacities = new Float32Array(streakCount);
        const colors = new Float32Array(streakCount * 3);

        for (let index = 0; index < streakCount; index += 1) {
          const bandIndex = Math.floor(streakRandom() * bandRadii.length);
          const direction = bandIndex % 2 === 0 ? 1 : -1;
          const tone = bandTones[bandIndex];
          const color = (tone === 'bronze' ? palette.bronzeEnergy : palette.silverEnergy).clone();

          if (streakRandom() > 0.82) {
            color.lerp(palette.coldWhite, 0.52);
          } else if (bandIndex === 0 && streakRandom() > 0.58) {
            color.lerp(new THREE.Color(0xa477ff), 0.34);
          }

          angles[index] = streakRandom() * TAU;
          radii[index] = bandRadii[bandIndex] + (streakRandom() - 0.5) * 0.16;
          speeds[index] = direction * (0.018 + streakRandom() * 0.036);
          heights[index] = 0.26 + streakRandom() * 0.56 + bandIndex * 0.018;
          lengths[index] = 0.16 + streakRandom() * 0.42;
          widths[index] = 0.018 + streakRandom() * 0.036;
          phases[index] = streakRandom() * TAU;
          opacities[index] = 0.28 + streakRandom() * 0.46;
          colors.set([color.r, color.g, color.b], index * 3);
        }

        const plane = new THREE.PlaneGeometry(1, 1, 1, 1);
        const geometry = new THREE.InstancedBufferGeometry();
        geometry.setIndex(plane.index.clone());
        geometry.setAttribute('position', plane.attributes.position.clone());
        geometry.setAttribute('uv', plane.attributes.uv.clone());
        geometry.setAttribute('aAngle', new THREE.InstancedBufferAttribute(angles, 1));
        geometry.setAttribute('aRadius', new THREE.InstancedBufferAttribute(radii, 1));
        geometry.setAttribute('aSpeed', new THREE.InstancedBufferAttribute(speeds, 1));
        geometry.setAttribute('aHeight', new THREE.InstancedBufferAttribute(heights, 1));
        geometry.setAttribute('aLength', new THREE.InstancedBufferAttribute(lengths, 1));
        geometry.setAttribute('aWidth', new THREE.InstancedBufferAttribute(widths, 1));
        geometry.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
        geometry.setAttribute('aOpacity', new THREE.InstancedBufferAttribute(opacities, 1));
        geometry.setAttribute('aColor', new THREE.InstancedBufferAttribute(colors, 3));
        geometry.instanceCount = streakCount;
        plane.dispose();

        const uniforms = {
          uTime: { value: 0 },
          uSurge: { value: 0 },
          uDial: { value: 1 },
        };
        const material = new THREE.ShaderMaterial({
          uniforms,
          transparent: true,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          toneMapped: false,
          vertexShader: /* glsl */ `
            uniform float uTime;
            uniform float uSurge;
            attribute float aAngle;
            attribute float aRadius;
            attribute float aSpeed;
            attribute float aHeight;
            attribute float aLength;
            attribute float aWidth;
            attribute float aPhase;
            attribute float aOpacity;
            attribute vec3 aColor;
            varying vec2 vUv;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vHeat;

            void main() {
              float angle = aAngle + uTime * aSpeed + sin(uTime * 0.17 + aPhase) * 0.012;
              float direction = aSpeed < 0.0 ? -1.0 : 1.0;
              float height = aHeight + sin(uTime * 0.3 + aPhase) * 0.07;
              float pulse = sin(uTime * 0.62 + aPhase) * 0.5 + 0.5;
              vec3 radial = vec3(cos(angle), 0.0, sin(angle));
              vec3 tangent = vec3(-sin(angle), 0.0, cos(angle)) * direction;
              vec3 localPosition =
                radial * (aRadius + position.y * aWidth * (1.0 + uSurge * 0.32)) +
                tangent * (position.x * aLength * (0.86 + pulse * 0.18 + uSurge * 0.22));
              localPosition.y = height + position.y * aWidth * 0.32;

              vUv = uv;
              vColor = mix(aColor, vec3(1.0), uSurge * 0.16);
              vAlpha = aOpacity * (0.76 + pulse * 0.24 + uSurge * 0.48);
              vHeat = pulse * 0.45 + uSurge * 0.8;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(localPosition, 1.0);
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uDial;
            varying vec2 vUv;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vHeat;

            void main() {
              float edge = pow(max(sin(vUv.y * 3.14159265359), 0.0), 1.8);
              float tail = smoothstep(0.0, 0.16, vUv.x) * (1.0 - smoothstep(0.86, 1.0, vUv.x));
              float head = exp(-pow((vUv.x - 0.78) * 7.2, 2.0));
              float energy = edge * tail * (0.34 + vUv.x * 0.66) + edge * head * 0.72;
              float alpha = energy * vAlpha * uDial;
              if (alpha < 0.006) discard;
              vec3 color = mix(vColor, vec3(1.0), head * (0.5 + vHeat * 0.18));
              gl_FragColor = vec4(color, alpha);
            }
          `,
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.frustumCulled = false;
        mesh.renderOrder = 8;
        return { mesh, uniforms };
      }

      function createNebulaDome() {
        const uniforms = {
          uTime: { value: 0 },
          uDial: { value: 1 },
        };
        const material = new THREE.ShaderMaterial({
          uniforms,
          side: THREE.BackSide,
          depthWrite: false,
          fog: false,
          vertexShader: /* glsl */ `
            varying vec3 vDirection;

            void main() {
              vDirection = normalize(position);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uTime;
            uniform float uDial;
            varying vec3 vDirection;

            float hash31(vec3 point) {
              point = fract(point * 0.1031);
              point += dot(point, point.yzx + 33.33);
              return fract((point.x + point.y) * point.z);
            }

            float noise3(vec3 point) {
              vec3 cell = floor(point);
              vec3 local = fract(point);
              local = local * local * (3.0 - 2.0 * local);
              return mix(
                mix(
                  mix(hash31(cell), hash31(cell + vec3(1.0, 0.0, 0.0)), local.x),
                  mix(hash31(cell + vec3(0.0, 1.0, 0.0)), hash31(cell + vec3(1.0, 1.0, 0.0)), local.x),
                  local.y
                ),
                mix(
                  mix(hash31(cell + vec3(0.0, 0.0, 1.0)), hash31(cell + vec3(1.0, 0.0, 1.0)), local.x),
                  mix(hash31(cell + vec3(0.0, 1.0, 1.0)), hash31(cell + vec3(1.0, 1.0, 1.0)), local.x),
                  local.y
                ),
                local.z
              );
            }

            float fbm(vec3 point) {
              float value = 0.0;
              float amplitude = 0.54;
              for (int octave = 0; octave < 5; octave++) {
                value += noise3(point) * amplitude;
                point = point * 2.03 + vec3(7.1, 3.7, 11.3);
                amplitude *= 0.48;
              }
              return value;
            }

            void main() {
              vec3 direction = normalize(vDirection);
              float time = uTime * 0.003;
              float broad = fbm(direction * 2.4 + vec3(time, -time * 0.4, time * 0.7));
              float detail = fbm(direction * 6.8 - vec3(time * 0.2, time, -time * 0.3));
              float band = exp(-abs(direction.y * 1.5 + sin(direction.x * 4.0) * 0.15) * 3.4);
              float cloud = smoothstep(0.43, 0.78, broad * 0.72 + detail * 0.34 + band * 0.16);
              float veins = pow(1.0 - abs(detail * 2.0 - 1.0), 6.0) * cloud;

              // The dome used to be a single violet: every cloud, vein and corner the same
              // hue, which read as a flat backdrop card. A slow large-scale field now drifts
              // parts of the cloud toward teal and a few pockets toward ember, so the sky
              // reads as layered nebula. Both accents stay well below the violet so the
              // astrolabe keeps the colour lead.
              float hueDrift = fbm(direction * 1.35 + vec3(-time * 0.6, time * 0.25, 4.7));
              vec3 violetHue = vec3(0.095, 0.019, 0.15);
              vec3 tealHue = vec3(0.016, 0.075, 0.115);
              vec3 emberHue = vec3(0.115, 0.045, 0.028);
              vec3 cloudHue = mix(violetHue, tealHue, smoothstep(0.34, 0.72, hueDrift) * 0.55);
              float emberField = fbm(direction * 2.2 + vec3(11.7, 5.1, -3.9));
              cloudHue = mix(cloudHue, emberHue, smoothstep(0.6, 0.88, emberField) * 0.3);

              // Everything above the base floor scales with the Sky dial; the floor itself
              // stays, so 0% reads as a clear night rather than a rendering hole.
              vec3 color = vec3(0.0042, 0.0036, 0.0125);
              vec3 skyLayers = cloudHue * cloud * 0.56;
              skyLayers += vec3(0.024, 0.022, 0.074) * pow(cloud, 1.8) * 0.31;
              skyLayers += vec3(0.12, 0.035, 0.19) * veins * 0.18;

              // Aurora curtains just above the horizon. The cloud drift above is glacial on
              // purpose; the curtains take their own faster clock or they would read as a
              // stationary green stripe. Kept dim: they are set dressing behind the disc.
              float auroraTime = uTime * 0.045;
              float azimuth = atan(direction.x, direction.z);
              float curtainWave =
                fbm(vec3(azimuth * 1.6, direction.y * 3.0 - auroraTime * 0.9, 2.5)) - 0.5;
              float curtainBand = exp(-pow((direction.y - 0.16 - curtainWave * 0.14) * 5.2, 2.0));
              float curtainRipple =
                0.55 + 0.45 * sin(azimuth * 7.0 + auroraTime * 2.2 + curtainWave * 5.0);
              float aurora = curtainBand * curtainRipple;
              skyLayers += vec3(0.035, 0.11, 0.085) * aurora * 0.34;
              skyLayers += vec3(0.05, 0.03, 0.12) * curtainBand * 0.12;
              color += skyLayers * uDial;

              gl_FragColor = vec4(color, 1.0);
            }
          `,
        });
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(BACKDROP_RADIUS, 64, 40), material);
        return { mesh, uniforms };
      }

      function createStarfield(count) {
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const sizes = new Float32Array(count);

        for (let index = 0; index < count; index += 1) {
          const radius = THREE.MathUtils.lerp(17, 42, Math.pow(random(), 0.55));
          const azimuth = random() * TAU;
          const elevation = Math.acos(THREE.MathUtils.lerp(-1, 1, random()));
          const point = new THREE.Vector3().setFromSphericalCoords(radius, elevation, azimuth);
          positions.set([point.x, point.y, point.z], index * 3);

          const choice = random();
          const color =
            choice > 0.9
              ? new THREE.Color(0xb4a2d8)
              : choice > 0.74
                ? new THREE.Color(0x91a6cc)
                : new THREE.Color(0xd8cfca);
          const intensity = THREE.MathUtils.lerp(0.24, 0.72, Math.pow(random(), 2.5));
          colors.set([color.r * intensity, color.g * intensity, color.b * intensity], index * 3);
          sizes[index] = THREE.MathUtils.lerp(0.2, 0.9, Math.pow(random(), 2.8));
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.ShaderMaterial({
          uniforms: {
            uPixelRatio: { value: 1 },
            uTime: { value: 0 },
            uDial: { value: 1 },
          },
          transparent: true,
          depthWrite: false,
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          vertexShader: /* glsl */ `
            attribute float aSize;
            varying vec3 vColor;
            varying float vPhase;
            uniform float uPixelRatio;

            void main() {
              vColor = color;
              // Deterministic per-star phase from the position, so the twinkle pattern is
              // stable across reloads without another attribute upload.
              vPhase = fract(sin(dot(position, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
              vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
              gl_Position = projectionMatrix * viewPosition;
              gl_PointSize = clamp(aSize * uPixelRatio * (105.0 / max(-viewPosition.z, 1.0)), 0.5, 4.0);
            }
          `,
          fragmentShader: /* glsl */ `
            varying vec3 vColor;
            varying float vPhase;
            uniform float uTime;
            uniform float uDial;

            void main() {
              vec2 point = gl_PointCoord - 0.5;
              float radius = length(point);
              float alpha = smoothstep(0.5, 0.04, radius);
              if (alpha < 0.01) discard;
              // Gentle scintillation: +/-22% at 0.6..2.3 rad/s of scene time, per-star phase.
              // Any deeper and the field strobes; any faster and it reads as electrical noise.
              float twinkle = 0.78 + 0.22 * sin(uTime * (0.6 + vPhase * 1.7) + vPhase * 6.2832);
              gl_FragColor = vec4(vColor, alpha * 0.72 * twinkle * uDial);
            }
          `,
        });

        const points = new THREE.Points(geometry, material);
        points.userData.material = material;
        return points;
      }

      function createMicroTexture() {
        const size = 256;
        const surfaceCanvas = document.createElement('canvas');
        surfaceCanvas.width = size;
        surfaceCanvas.height = size;
        const context = surfaceCanvas.getContext('2d');
        const image = context.createImageData(size, size);
        const surfaceRandom = mulberry32(0x70f1c2);

        for (let index = 0; index < image.data.length; index += 4) {
          const grain = 82 + Math.floor(surfaceRandom() * 72);
          image.data[index] = grain;
          image.data[index + 1] = grain;
          image.data[index + 2] = grain;
          image.data[index + 3] = 255;
        }
        context.putImageData(image, 0, 0);

        context.globalAlpha = 0.18;
        context.strokeStyle = '#e8dfef';
        context.lineWidth = 0.55;
        for (let index = 0; index < 46; index += 1) {
          const x = surfaceRandom() * size;
          const y = surfaceRandom() * size;
          const length = 10 + surfaceRandom() * 48;
          context.beginPath();
          context.moveTo(x, y);
          context.lineTo(x + length, y + surfaceRandom() * 2 - 1);
          context.stroke();
        }

        const texture = new THREE.CanvasTexture(surfaceCanvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(4, 4);
        texture.colorSpace = THREE.NoColorSpace;
        texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        return texture;
      }

      function createEnergyAura() {
        const uniforms = {
          uTime: { value: 0 },
        };
        const material = new THREE.ShaderMaterial({
          uniforms,
          transparent: true,
          depthWrite: false,
          depthTest: true,
          blending: THREE.AdditiveBlending,
          toneMapped: false,
          side: THREE.DoubleSide,
          vertexShader: /* glsl */ `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uTime;
            varying vec2 vUv;

            void main() {
              vec2 point = vUv - 0.5;
              float radius = length(point) * 2.0;
              float angle = atan(point.y, point.x);
              float outerField = exp(-pow((radius - 0.84) * 4.9, 2.0));
              float innerField = (1.0 - smoothstep(0.12, 0.98, radius)) * 0.15;
              float drift = sin(angle * 5.0 - uTime * 0.055 + sin(angle * 3.0) * 0.7);
              float breath = 0.88 + sin(uTime * 0.16) * 0.08;
              float alpha = (outerField * 0.118 + innerField * 0.024) *
                (0.9 + drift * 0.1) * breath;
              vec3 color = mix(
                vec3(0.055, 0.026, 0.17),
                vec3(0.19, 0.055, 0.42),
                outerField
              );
              if (alpha < 0.002) discard;
              gl_FragColor = vec4(color, alpha);
            }
          `,
        });
        const mesh = new THREE.Mesh(new THREE.CircleGeometry(6.25, 192), material);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.y = -0.16;
        mesh.renderOrder = 0;
        return { mesh, uniforms };
      }

      function createEnergyVeinMaterial(tone, phase, intensity, radius, flowDirection) {
        const coreColor = tone === 'bronze' ? new THREE.Color(0xffa25f) : new THREE.Color(0x9eb5ff);
        const hotColor = tone === 'bronze' ? new THREE.Color(0xffead3) : new THREE.Color(0xf0f4ff);
        // Same linear speed on every rim, so the period grows with the radius.
        const flowSeconds = (RIM_FLOW_OUTER_SECONDS * radius) / RIM_FLOW_REFERENCE_RADIUS;
        const material = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uPhase: { value: phase },
            uIntensity: { value: intensity },
            uSurge: { value: 0 },
            uSpeed: {
              value: (flowDirection * RIM_FLOW_HEADS) / (flowSeconds * SCENE_TIME_SCALE),
            },
            uHeads: { value: RIM_FLOW_HEADS },
            uCoreColor: { value: coreColor },
            uHotColor: { value: hotColor },
          },
          transparent: true,
          depthWrite: false,
          depthTest: true,
          blending: THREE.AdditiveBlending,
          toneMapped: false,
          vertexShader: /* glsl */ `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uTime;
            uniform float uPhase;
            uniform float uIntensity;
            uniform float uSurge;
            uniform float uSpeed;
            uniform float uHeads;
            uniform vec3 uCoreColor;
            uniform vec3 uHotColor;
            varying vec2 vUv;

            // How far behind the head this fragment sits, and how fast the head's wake decays.
            // The decay is asymmetric on purpose: a symmetric lobe reads as a bump swelling in
            // place, a hard front with a long wake reads as light travelling through a tube.
            const float WAKE_DECAY = 8.0;

            // At rest the flow runs at this fraction of full; the surge opens it to 1.0. The
            // scene's surge is the authored event, so the flow answers it instead of setting up
            // a second, competing rhythm of its own.
            const float REST_AMPLITUDE = 0.45;

            void main() {
              float behind = fract(uTime * uSpeed - vUv.x * uHeads + uPhase);
              float wake = exp(-behind * WAKE_DECAY);
              // A dim breath just ahead of the front, so the leading edge is crisp without
              // being a single-pixel step that shimmers as it travels.
              float approach = exp(-(1.0 - behind) * WAKE_DECAY * 5.0) * 0.3;
              float flow = clamp(wake + approach, 0.0, 1.0);
              float energy = flow * mix(REST_AMPLITUDE, 1.0, clamp(uSurge, 0.0, 1.0));
              float crossSection = pow(sin(vUv.y * 3.14159265359), 0.72);
              float alpha = (0.05 + energy * 0.86) * crossSection * uIntensity *
                (1.0 + uSurge * 0.72);
              vec3 color = mix(uCoreColor, uHotColor, energy * 0.86);
              color = mix(color, uHotColor, uSurge * 0.28);
              gl_FragColor = vec4(color, alpha);
            }
          `,
        });
        energyUniformTracks.push(material.uniforms.uTime);
        energySurgeTracks.push(material.uniforms.uSurge);
        rimEnergyStrengthTracks.push({
          uniform: material.uniforms.uIntensity,
          base: intensity,
        });
        return material;
      }

      function createHorizontalTorus(
        radius,
        tube,
        material,
        tubularSegments = 192,
        radialSegments = 8,
      ) {
        const mesh = new THREE.Mesh(
          new THREE.TorusGeometry(radius, tube, radialSegments, tubularSegments),
          material,
        );
        mesh.rotation.x = -Math.PI / 2;
        return mesh;
      }

      function createLuminousTorus(
        radius,
        tube,
        material,
        tone,
        tubularSegments = 192,
        radialSegments = 8,
        flowDirection = 1,
      ) {
        const group = new THREE.Group();
        const energyScale =
          radius >= 4.5
            ? 0.82
            : radius >= 3.5
              ? 0.9
              : radius >= 2.3
                ? 0.98
                : radius >= 1.2
                  ? 1.07
                  : 1.18;
        const energyColor = tone === 'bronze' ? palette.bronzeEnergy : palette.silverEnergy;
        const coreMaterial = material.clone();
        coreMaterial.emissive.copy(energyColor);
        coreMaterial.emissiveIntensity =
          (tone === 'bronze' ? 0.8 : 0.72) * energyScale * RIM_CORE_REBALANCE;

        const core = createHorizontalTorus(
          radius,
          tube,
          coreMaterial,
          tubularSegments,
          radialSegments,
        );
        group.add(core);

        const haloMaterial = new THREE.MeshBasicMaterial({
          color: energyColor,
          transparent: true,
          opacity: (tone === 'bronze' ? 0.16 : 0.14) * energyScale * RIM_HALO_REBALANCE,
          depthWrite: false,
          depthTest: true,
          blending: THREE.AdditiveBlending,
          toneMapped: false,
        });
        const halo = createHorizontalTorus(
          radius,
          tube * 3,
          haloMaterial,
          tubularSegments,
          Math.max(8, radialSegments),
        );
        halo.renderOrder = 1;
        group.add(halo);
        screenSpaceRimHalos.push({
          mesh: halo,
          radius,
          tube: tube * 3,
          tubularSegments,
          radialSegments: Math.max(8, radialSegments),
        });

        const veinMaterial = createEnergyVeinMaterial(
          tone,
          radius * 1.73,
          energyScale * RIM_VEIN_GAIN,
          radius,
          flowDirection,
        );
        const vein = createHorizontalTorus(
          radius,
          tube * 1.045,
          veinMaterial,
          tubularSegments,
          Math.max(10, radialSegments),
        );
        vein.renderOrder = 2;
        group.add(vein);

        energyTracks.push(
          {
            material: coreMaterial,
            property: 'emissiveIntensity',
            channel: 'rims',
            base: coreMaterial.emissiveIntensity,
            amplitude: 0.05 * energyScale * RIM_CORE_REBALANCE,
            phase: radius * 1.13,
            speed: 0.2,
          },
          {
            material: haloMaterial,
            property: 'opacity',
            channel: 'rims',
            base: haloMaterial.opacity,
            amplitude: 0.012 * energyScale * RIM_HALO_REBALANCE,
            phase: radius * 1.13 + 0.8,
            speed: 0.2,
          },
        );

        return group;
      }

      function addLighting() {
        scene.add(new THREE.HemisphereLight(0x68799d, 0x0b0710, 0.055));

        const coldKey = new THREE.DirectionalLight(0xa8b7d5, 0.17);
        coldKey.position.set(-4.8, 9.5, 4.6);
        coldKey.castShadow = true;
        coldKey.shadow.mapSize.set(2048, 2048);
        coldKey.shadow.camera.left = -6;
        coldKey.shadow.camera.right = 6;
        coldKey.shadow.camera.top = 6;
        coldKey.shadow.camera.bottom = -6;
        coldKey.shadow.camera.near = 1;
        coldKey.shadow.camera.far = 22;
        coldKey.shadow.bias = -0.0002;
        scene.add(coldKey);

        const bronzeRim = new THREE.RectAreaLight(0xc48b67, 0.34, 7, 3.5);
        bronzeRim.position.set(5.6, 3.8, -3.3);
        bronzeRim.lookAt(0, 0, 0);
        scene.add(bronzeRim);

        const violetFill = new THREE.RectAreaLight(0x554177, 0.17, 5, 4);
        violetFill.position.set(-5, 2.8, -4.5);
        violetFill.lookAt(0, 0, 0);
        scene.add(violetFill);

        const warmDrift = new THREE.PointLight(0xff8b52, 0.98, 6.8, 2.1);
        warmDrift.position.set(4.2, 0.85, 1.4);
        astrolabe.add(warmDrift);

        const coolDrift = new THREE.PointLight(0x9db5ff, 0.84, 6.4, 2.1);
        coolDrift.position.set(-3.7, 0.72, -1.8);
        astrolabe.add(coolDrift);

        return { warmDrift, coolDrift };
      }

      function resize() {
        const bounds = stage.getBoundingClientRect();
        const width = Math.max(1, Math.round(bounds.width));
        const height = Math.max(1, Math.round(bounds.height));
        const aspect = width / height;
        const pixelRatio = Math.min(devicePixelRatio, 1.5);
        const verticalFov = THREE.MathUtils.degToRad(10.5);
        const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * aspect);
        const widthDistance = (5.25 / Math.tan(horizontalFov / 2)) * 1.025;
        const distance = Math.max(34.2, widthDistance);

        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(width, height, false);
        composer.setPixelRatio(pixelRatio);
        // composer.setSize forwards device-pixel dimensions to every pass, including the
        // bloom pyramid; a second explicit bloom.setSize(width, height) here would rebuild
        // it at CSS-pixel size and quietly halve the halo resolution on hiDPI screens.
        composer.setSize(width, height);

        camera.aspect = aspect;
        camera.fov = 10.5;
        cameraFramingDistance = distance;
        viewportHeightPx = height;
        // A drag may have raised the camera on a wide viewport where a narrower one cannot
        // vertically contain that elevation; re-clamp before placing.
        cameraElevationDeg = clampCameraElevation(cameraElevationDeg);
        placeCamera();

        gradePass.uniforms.uResolution.value.set(width * pixelRatio, height * pixelRatio);
        stars.userData.material.uniforms.uPixelRatio.value = pixelRatio;
        particleField.uniforms.uPixelRatio.value = pixelRatio;
      }

      // The vertical ceiling of the drag depends on the viewport: the framing solve fits the
      // disc's WIDTH, and the projected height of the tilted disc grows with sin(elevation),
      // so on wide aspects a high camera pushes the far rim off the top of the frame. The
      // predicate mirrors the framing solve (5.25 half-width plus glow margin, perspective
      // shrink of the far rim) and is walked in whole degrees — an analytic inverse is not
      // worth the fragility here.
      function clampCameraElevation(degrees) {
        const halfVisibleHeight =
          cameraFramingDistance * Math.tan(THREE.MathUtils.degToRad(10.5) / 2);
        let ceiling = CAMERA_ELEVATION_MIN;
        for (
          let candidate = CAMERA_ELEVATION_MAX;
          candidate >= CAMERA_ELEVATION_MIN;
          candidate -= 1
        ) {
          const radians = THREE.MathUtils.degToRad(candidate);
          const projectedHalfHeight =
            (5.45 * Math.sin(radians) * cameraFramingDistance) /
            (cameraFramingDistance + 5.25 * Math.cos(radians) * 0.8);
          if (projectedHalfHeight <= halfVisibleHeight * 0.97) {
            ceiling = candidate;
            break;
          }
        }
        // The shipped default always remains reachable: it is the calibrated composition and
        // the approximation above must never clamp us out of it.
        ceiling = Math.max(ceiling, CAMERA_ELEVATION_DEFAULT);
        return THREE.MathUtils.clamp(degrees, CAMERA_ELEVATION_MIN, ceiling);
      }

      function placeCamera() {
        const radians = THREE.MathUtils.degToRad(cameraElevationDeg);
        cameraDirection.set(0, Math.sin(radians), Math.cos(radians));
        // The framing solve backs the camera off to fit the disc's width, so on a narrow
        // viewport the distance grows without bound. The far plane has to follow it. A fixed
        // far silently truncated the solve: below roughly 0.62 aspect the disc's far edge fell
        // outside it, and below 0.585 the camera itself sat beyond it and the frame rendered as
        // bare starfield. The portrait evidence in design-qa.md was captured at 0.75 and 0.735,
        // just clear of that cliff, which is why no earlier pass saw it.
        camera.far = cameraFramingDistance + BACKDROP_RADIUS * 1.08;
        camera.position.copy(cameraTarget).addScaledVector(cameraDirection, cameraFramingDistance);
        camera.lookAt(cameraTarget);
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld();

        // The screen-space glow compensation reads the camera projection, so it must rerun
        // after every pose change — drags included — or the halo radii drift with elevation.
        const projectedOuter = outerGlowProjectionSample.clone().project(camera);
        const projectedInner = outerGlowProjectionSampleInward.clone().project(camera);
        const projectedPixelsPerWorld =
          (Math.abs(projectedOuter.y - projectedInner.y) * viewportHeightPx * 0.5) / 0.01;
        const nextScreenGlowScale = THREE.MathUtils.clamp(
          referenceOuterGlowPixelsPerWorld / projectedPixelsPerWorld,
          0.35,
          4,
        );
        updateScreenSpaceGlowScale(nextScreenGlowScale);
      }

      function setupCameraDrag() {
        let activePointerId = null;
        let lastPointerY = 0;

        stage.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          // The glow console owns its own pointer interactions; a drag that starts there
          // must not also steer the camera.
          if (event.target.closest('.glow-console')) return;
          activePointerId = event.pointerId;
          lastPointerY = event.clientY;
          stage.setPointerCapture(event.pointerId);
          stage.classList.add('is-dragging');
        });
        stage.addEventListener('pointermove', (event) => {
          if (event.pointerId !== activePointerId) return;
          const deltaY = event.clientY - lastPointerY;
          lastPointerY = event.clientY;
          // Dragging up raises the camera toward top-down; 0.22 deg/px spans the full
          // authored range in roughly a quarter of a typical viewport height.
          cameraElevationDeg = clampCameraElevation(cameraElevationDeg - deltaY * 0.22);
          placeCamera();
        });
        const endDrag = (event) => {
          if (event.pointerId !== activePointerId) return;
          activePointerId = null;
          stage.classList.remove('is-dragging');
        };
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);
      }

      function setupGlowControls() {
        const inputs = [...document.querySelectorAll('[data-glow-channel]')];
        const resetButton = document.querySelector('#glow-reset');

        function commitValue(input, value) {
          const minimum = Number(input.min);
          const maximum = Number(input.max);
          const step = Number(input.step) || 1;
          const clamped = Math.min(maximum, Math.max(minimum, value));
          const snapped = minimum + Math.round((clamped - minimum) / step) * step;
          input.value = String(snapped);
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function updateFromPointer(input, face, event) {
          const bounds = face.getBoundingClientRect();
          const offsetX = event.clientX - (bounds.left + bounds.width * 0.5);
          const offsetY = event.clientY - (bounds.top + bounds.height * 0.5);
          if (Math.hypot(offsetX, offsetY) < bounds.width * 0.13) return;
          let angle = (Math.atan2(offsetY, offsetX) * 180) / Math.PI + 90;
          if (angle > 180) angle -= 360;
          if (angle > 135 || angle < -135) angle = offsetX < 0 ? -135 : 135;
          const normalized = (angle + 135) / 270;
          commitValue(
            input,
            Number(input.min) + normalized * (Number(input.max) - Number(input.min)),
          );
        }

        for (const input of inputs) {
          const control = input.closest('[data-dial-control]');
          const face = control.querySelector('.glow-dial__face');
          const output = input.closest('.glow-dial').querySelector('output');

          input.addEventListener('input', () => {
            const normalized =
              (Number(input.value) - Number(input.min)) / (Number(input.max) - Number(input.min));
            face.style.setProperty('--dial-progress', `${normalized * 270}deg`);
            face.style.setProperty('--dial-angle', `${-135 + normalized * 270}deg`);
            output.value = `${input.value}%`;
            input.setAttribute('aria-valuetext', `${input.value} percent`);
            glowSettings[input.dataset.glowChannel] = Number(input.value) / 100;
          });
          input.addEventListener('keydown', (event) => {
            const keySteps = {
              ArrowDown: -1,
              ArrowLeft: -1,
              ArrowRight: 1,
              ArrowUp: 1,
              PageDown: -10,
              PageUp: 10,
            };
            if (event.key === 'Home') {
              event.preventDefault();
              commitValue(input, Number(input.min));
            } else if (event.key === 'End') {
              event.preventDefault();
              commitValue(input, Number(input.max));
            } else if (event.key in keySteps) {
              event.preventDefault();
              commitValue(input, Number(input.value) + keySteps[event.key] * Number(input.step));
            }
          });

          control.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            control.setPointerCapture(event.pointerId);
            input.focus({ preventScroll: true });
            updateFromPointer(input, face, event);
          });
          control.addEventListener('pointermove', (event) => {
            if (!control.hasPointerCapture(event.pointerId)) return;
            updateFromPointer(input, face, event);
          });
          control.addEventListener(
            'wheel',
            (event) => {
              event.preventDefault();
              commitValue(input, Number(input.value) + (event.deltaY < 0 ? 5 : -5));
            },
            { passive: false },
          );

          input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        resetButton.addEventListener('click', () => {
          for (const input of inputs) commitValue(input, Number(input.defaultValue));
        });
      }

      // 30fps cap. The piece is a slow ambient animation — nothing in it needs 60/120fps,
      // and on laptops the uncapped loop ran the GPU hot for no visible gain. Scene time
      // still comes from the wall clock, so the cap changes smoothness only, never tempo.
      const FRAME_INTERVAL_MS = 1000 / 30;
      let lastFrameStamp = -Infinity;

      function animate(frameStamp = 0) {
        requestAnimationFrame(animate);
        // The -1 tolerance keeps a 60Hz display on exact halves (every 2nd frame = 30fps)
        // instead of drifting to every 3rd when rAF lands a fraction of a ms early.
        if (frameStamp - lastFrameStamp < FRAME_INTERVAL_MS - 1) return;
        lastFrameStamp = frameStamp;
        const elapsed = reducedMotion ? reducedMotionTime : clock.getElapsedTime();
        const time = elapsed * SCENE_TIME_SCALE;
        const surge = Math.pow(Math.max(0, Math.sin(time * 0.24 - 0.9)), 10);

        nebula.uniforms.uTime.value = time;
        energyAura.uniforms.uTime.value = time;
        particleField.uniforms.uTime.value = time;
        particleField.uniforms.uSurge.value = surge;
        gradePass.uniforms.uTime.value = time;
        orbitStreaks.uniforms.uTime.value = time;
        orbitStreaks.uniforms.uSurge.value = surge;
        const averageGlow = (glowSettings.letters + glowSettings.rims) * 0.5;
        // Scatter fraction and pyramid feedback for MipBloomPass — new scales, see the pass.
        // Rest state at the shipped dials (averageGlow 1.7) sits at ~0.15 scatter; the surge
        // widens and brightens the halation instead of adding a second additive layer.
        bloom.strength =
          (0.08 + averageGlow * 0.042 + surge * (0.05 + averageGlow * 0.02)) * glowSettings.bloom;
        bloom.radius = 0.72 + Math.min(averageGlow, 2) * 0.06 + surge * 0.08;
        particleField.uniforms.uDial.value = glowSettings.particles;
        orbitStreaks.uniforms.uDial.value = glowSettings.particles;
        nebula.uniforms.uDial.value = glowSettings.sky;
        stars.userData.material.uniforms.uDial.value = glowSettings.sky;

        for (const track of motionTracks) {
          track.group.rotation.y = track.phase + (time * TAU * track.direction) / track.period;
          if ('position' in track.group) {
            track.group.position.y =
              track.baseY + Math.sin(time * 0.28 + track.phase * 5.0) * track.floatAmplitude;
          }
        }

        aperture.light.intensity =
          (0.3 + Math.sin(time * 0.42) * 0.035 + surge * 0.34) * Math.max(0.05, glowSettings.rims);
        for (const glint of glints.items) {
          glint.material.opacity =
            glint.baseOpacity *
            (0.58 + (Math.sin(time * 0.73 + glint.phase) * 0.5 + 0.5) * 0.22) *
            glowSettings.particles;
        }
        for (const track of energyTracks) {
          const channelStrength = glowSettings[track.channel];
          track.material[track.property] = Math.max(
            0,
            (track.base + Math.sin(time * track.speed + track.phase) * track.amplitude) *
              channelStrength,
          );
        }
        for (const ignition of runeIgnitionTracks) {
          ignition.time.value = time;
          ignition.strength.value = ignition.base * glowSettings.letters;
          ignition.surge.value = surge;
        }
        for (const uniform of energyUniformTracks) {
          uniform.value = time;
        }
        for (const uniform of energySurgeTracks) {
          uniform.value = surge;
        }
        for (const track of rimEnergyStrengthTracks) {
          track.uniform.value = track.base * glowSettings.rims;
        }
        const warmAngle = time * 0.055 + 0.42;
        energyLights.warmDrift.position.set(
          Math.cos(warmAngle) * 4.4,
          0.78 + Math.sin(time * 0.13) * 0.08,
          Math.sin(warmAngle) * 4.4,
        );
        const coolAngle = -time * 0.043 + 2.18;
        energyLights.coolDrift.position.set(
          Math.cos(coolAngle) * 3.8,
          0.72 + Math.sin(time * 0.11 + 1.3) * 0.07,
          Math.sin(coolAngle) * 3.8,
        );
        energyLights.warmDrift.intensity = 0.98 + surge * 0.34;
        energyLights.coolDrift.intensity = 0.84 + surge * 0.28;
        stars.rotation.y = time * 0.0012;
        stars.userData.material.uniforms.uTime.value = time;
        composer.render();
      }

      function mulberry32(seed) {
        return function seededRandom() {
          let value = (seed += 0x6d2b79f5);
          value = Math.imul(value ^ (value >>> 15), value | 1);
          value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };
      }

      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(stage);
      resize();
      setupCameraDrag();
      animate();
    </script>
  </body>
</html>
